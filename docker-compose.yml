services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_intel
    ports:
      - "5432:5432"
    volumes:
      - enterprise_intel_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_intel"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  enterprise_intel_pg:
