services:
  - type: web
    name: enterprise-intel-api
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_BASE_URL
        value: https://router.huggingface.co/hf-inference/v1
      - key: HF_MODEL_ID
        value: meta-llama/Llama-3.2-3B-Instruct
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
