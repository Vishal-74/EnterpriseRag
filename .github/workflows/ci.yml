name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/enterprise_intel_test
      JWT_SECRET: test-secret-that-is-long-enough-for-jwt
      ENVIRONMENT: test
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Create the test database
        run: python -c "import psycopg; c=psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres'); c.autocommit=True; c.execute('CREATE DATABASE enterprise_intel_test')"
      - name: Lint and test
        working-directory: backend
        run: |
          ruff check app tests eval scripts
          ruff format --check app tests eval scripts
          mypy app
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, and build
        working-directory: frontend
        env:
          API_URL: http://localhost:8000
        run: |
          npm ci
          npm run lint
          npm run build
